services:
  app:
    build: .
    restart: unless-stopped
    environment:
      TEACHER_INVITE_CODE: ${TEACHER_INVITE_CODE:?Set TEACHER_INVITE_CODE in .env}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    volumes:
      - platform-data:/data
    expose:
      - "8000"
    networks:
      - backend

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    networks:
      - backend

networks:
  backend:

volumes:
  platform-data:
  caddy-data:
  caddy-config:
